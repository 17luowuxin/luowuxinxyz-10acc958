server {
    listen 80;
    server_name luowuxin.xyz www.luowuxin.xyz;

    root /www/wwwroot/luowuxin.xyz/dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Lovable Cloud proxy for users in regions where direct backend access is unreliable
    location ^~ /supabase/rest/ {
        proxy_pass https://emvolhvffoqsfmhbcadk.supabase.co/rest/;
        proxy_ssl_server_name on;
        proxy_set_header Host emvolhvffoqsfmhbcadk.supabase.co;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location ^~ /supabase/auth/ {
        proxy_pass https://emvolhvffoqsfmhbcadk.supabase.co/auth/;
        proxy_ssl_server_name on;
        proxy_set_header Host emvolhvffoqsfmhbcadk.supabase.co;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location ^~ /supabase/storage/ {
        proxy_pass https://emvolhvffoqsfmhbcadk.supabase.co/storage/;
        proxy_ssl_server_name on;
        proxy_set_header Host emvolhvffoqsfmhbcadk.supabase.co;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location ^~ /supabase/functions/ {
        proxy_pass https://emvolhvffoqsfmhbcadk.supabase.co/functions/;
        proxy_ssl_server_name on;
        proxy_set_header Host emvolhvffoqsfmhbcadk.supabase.co;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # External user database proxy used by new registrations
    location ^~ /external-supabase/rest/ {
        proxy_pass https://lxbusdoqghkcajlctbqg.supabase.co/rest/;
        proxy_ssl_server_name on;
        proxy_set_header Host lxbusdoqghkcajlctbqg.supabase.co;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location ^~ /external-supabase/auth/ {
        proxy_pass https://lxbusdoqghkcajlctbqg.supabase.co/auth/;
        proxy_ssl_server_name on;
        proxy_set_header Host lxbusdoqghkcajlctbqg.supabase.co;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location ^~ /external-supabase/storage/ {
        proxy_pass https://lxbusdoqghkcajlctbqg.supabase.co/storage/;
        proxy_ssl_server_name on;
        proxy_set_header Host lxbusdoqghkcajlctbqg.supabase.co;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location ^~ /external-supabase/functions/ {
        proxy_pass https://lxbusdoqghkcajlctbqg.supabase.co/functions/;
        proxy_ssl_server_name on;
        proxy_set_header Host lxbusdoqghkcajlctbqg.supabase.co;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location ^~ /ai/api/chat {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location ^~ /ai/ {
        alias /www/wwwroot/luowuxin.xyz/ai/;
        index index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
